server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Header keamanan. TLS diterminasi oleh proxy di depan container ini;
  # HSTS tetap dikirim agar browser selalu memakai HTTPS untuk domain portal.
  # Tanpa includeSubDomains supaya tidak memaksa subdomain modul lain.
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Portal login tidak boleh dimuat di dalam iframe (mencegah clickjacking).
  add_header X-Frame-Options "DENY" always;

  # Routing SPA: semua path yang bukan file dikembalikan ke index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
