name: Build and Deploy

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO }}-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO }}-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_BASE_URL=https://api-login.sparta-alfamart.web.id
            VITE_APP_ENV=production
            VITE_SPARTA_SSO_ENABLED=false
            VITE_SPARTA_BUILDING_LOGIN_URL=https://building.sparta-alfamart.web.id
            VITE_SPARTA_MAINTENANCE_LOGIN_URL=https://maintenance.sparta-alfamart.web.id
            VITE_SPARTA_ENERGY_LOGIN_URL=https://energy.sparta-alfamart.web.id

      - name: Trigger Dokploy Webhooks
        run: |
          curl -X POST ${{ secrets.DOKPLOY_WEBHOOK_API }}
          curl -X POST ${{ secrets.DOKPLOY_WEBHOOK_WEB }}
